<p>QEMU with Raspberry Pi 4B GENET Ethernet support, and PXE boot firmware
emulation. Install <code>qemu-rpi-system-arm</code> (the
<code>qemu-rpi-system-aarch64</code> emulator), and <code>qemu-rpi-pxeboot</code>
to PXE boot from a standard Raspberry Pi TFTP layout. Debian trixie, amd64.
Static binaries are on the
<a href="https://github.com/fpgas-online/rpi-qemu/releases">GitHub Releases</a> page.</p>
