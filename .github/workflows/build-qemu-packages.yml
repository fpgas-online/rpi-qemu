name: Build QEMU RPi Packages

on:
  push:
    branches: [main]
  workflow_dispatch:

# contents: write for the GitHub Release. Only the publish job gets Pages
# rights, on its own job-level permissions.
permissions:
  contents: write

concurrency:
  group: build-qemu-packages
  cancel-in-progress: true

jobs:

  build-debs:
    name: Build Debian packages
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Install base tools
        run: |
          apt-get update
          apt-get install -y git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog and get version
        id: version
        run: |
          apt-get install -y dpkg-dev python3
          python3 ci/gen-changelog.py > ci/debian/changelog
          cat ci/debian/changelog
          version=$(dpkg-parsechangelog -l ci/debian/changelog -S Version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"

      - name: Install build dependencies
        run: |
          apt-get install -y --no-install-recommends \
            build-essential \
            dpkg-dev devscripts debhelper \
            meson ninja-build pkgconf \
            python3 python3-venv python3-setuptools python3-pip python3-pycotap \
            libglib2.0-dev libpixman-1-dev \
            libslirp-dev libcapstone-dev \
            libfdt-dev zlib1g-dev libzstd-dev \
            wget xz-utils

      - name: Build Debian packages
        run: python3 ci/build-debs.py --output-dir tmp/deb-output

      - name: List built packages
        run: ls -lh tmp/deb-output/

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qemu-rpi-debs
          path: tmp/deb-output/
          retention-days: 90

  build-static:
    name: Build static binary
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 45
    steps:
      - name: Install base tools
        run: |
          apt-get update
          apt-get install -y git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get install -y --no-install-recommends \
            build-essential \
            meson ninja-build pkgconf \
            python3 python3-venv python3-setuptools python3-pip python3-pycotap \
            libglib2.0-dev libfdt-dev zlib1g-dev libzstd-dev \
            wget xz-utils file

      - name: Clone and patch QEMU
        run: |
          # Use git clone (not Debian +ds tarball) so subprojects/slirp is available
          git clone --depth=1 --branch v11.1.0 \
            https://gitlab.com/qemu-project/qemu.git tmp/qemu-static-src
          cd tmp/qemu-static-src
          # Apply GENET patches (skip 0017 which is Debian +ds specific)
          for p in ../../ci/qemu-patches/*.patch; do
            case "$(basename $p)" in 0017-*) continue ;; esac
            echo "Applying: $(basename $p)"
            git apply "$p"
          done

      - name: Build static QEMU
        run: |
          cd tmp/qemu-static-src
          mkdir -p build && cd build
          ../configure \
            --target-list=aarch64-softmmu \
            --static \
            -Ddefault_library=static \
            --enable-slirp \
            --disable-pixman \
            --disable-capstone \
            --disable-docs \
            --disable-gtk \
            --disable-sdl \
            --disable-opengl \
            --disable-virglrenderer \
            --disable-spice \
            --disable-xen \
            --disable-werror \
            --disable-guest-agent \
            --disable-tools \
            --disable-gio \
            --firmwarepath=
          ninja -j$(nproc) qemu-system-aarch64

          echo "=== Static binary ==="
          ls -lh qemu-system-aarch64
          file qemu-system-aarch64
          ldd qemu-system-aarch64 2>&1 || echo "(static - no dynamic deps)"

      - name: Package static binary
        run: |
          mkdir -p tmp/static-output
          cp tmp/qemu-static-src/build/qemu-system-aarch64 \
             tmp/static-output/qemu-rpi-system-aarch64-static
          chmod +x tmp/static-output/qemu-rpi-system-aarch64-static
          tar czf tmp/static-output/qemu-rpi-static-linux-amd64.tar.gz \
            -C tmp/static-output qemu-rpi-system-aarch64-static

      - name: Upload static binary
        uses: actions/upload-artifact@v4
        with:
          name: qemu-rpi-static
          path: |
            tmp/static-output/qemu-rpi-static-linux-amd64.tar.gz
          retention-days: 90

  build-pxeboot:
    name: Build PXE boot firmware
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 30
    steps:
      - name: Install base tools
        run: |
          apt-get update
          apt-get install -y git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get install -y --no-install-recommends \
            build-essential gcc-aarch64-linux-gnu \
            make bc bison flex libssl-dev \
            python3 python3-setuptools python3-dev

      - name: Build PXE boot firmware
        run: |
          git clone --depth=100 https://github.com/u-boot/u-boot.git tmp/u-boot-pxeboot
          cd tmp/u-boot-pxeboot
          git checkout 47e064f13171f15817aa1b22b04e309964b15c2c
          cp ../../ci/rpi_4_qemu_pxeboot_defconfig configs/
          cp ../../ci/vc-boot-pi4b.env board/raspberrypi/rpi/pxeboot.env
          # Apply U-Boot patches (cfgtxt parser, etc.)
          for p in ../../ci/uboot-patches/*.patch; do
            [ -f "$p" ] && echo "Applying: $(basename $p)" && git apply "$p"
          done
          make rpi_4_qemu_pxeboot_defconfig
          make -j$(nproc) CROSS_COMPILE=aarch64-linux-gnu-

          echo "=== Firmware built ==="
          ls -lh u-boot.bin

      - name: Package firmware
        run: |
          mkdir -p tmp/pxeboot-output
          cp tmp/u-boot-pxeboot/u-boot.bin tmp/pxeboot-output/rpi4b-pxeboot.bin
          cp tmp/u-boot-pxeboot/arch/arm/dts/bcm2711-rpi-4-b.dtb tmp/pxeboot-output/rpi4b-pxeboot.dtb
          ls -lh tmp/pxeboot-output/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: qemu-rpi-pxeboot
          path: tmp/pxeboot-output/
          retention-days: 90

  stage-apt:
    # Gather this run's .debs (plus the pxeboot firmware deb, built here) into
    # the artifact the shared publish workflow indexes: debs-<suite>-<arch>.
    name: Stage APT packages
    needs: [build-debs, build-pxeboot]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download deb artifacts
        uses: actions/download-artifact@v4
        with:
          name: qemu-rpi-debs
          path: tmp/debs/

      - name: Download pxeboot firmware
        uses: actions/download-artifact@v4
        with:
          name: qemu-rpi-pxeboot
          path: tmp/pxeboot-firmware/

      - name: Build pxeboot deb
        run: |
          apt-get update && apt-get install -y python3
          DEB_VERSION=$(python3 ci/gen-changelog.py --deb-version)
          FILE_VERSION=$(python3 ci/gen-changelog.py --version-only)
          echo "Pxeboot deb version: $DEB_VERSION (file: $FILE_VERSION)"

          PKG=tmp/pxeboot-pkg
          mkdir -p $PKG/usr/share/qemu-rpi-pxeboot
          cp tmp/pxeboot-firmware/rpi4b-pxeboot.bin $PKG/usr/share/qemu-rpi-pxeboot/
          cp tmp/pxeboot-firmware/rpi4b-pxeboot.dtb $PKG/usr/share/qemu-rpi-pxeboot/

          mkdir -p $PKG/DEBIAN
          cat > $PKG/DEBIAN/control <<CTRL
          Package: qemu-rpi-pxeboot
          Version: ${DEB_VERSION}
          Architecture: all
          Maintainer: Tim Ansell <mithro@mithis.com>
          Recommends: qemu-rpi-system-arm
          Description: PXE network boot emulation for QEMU Raspberry Pi 4B
           Enables QEMU raspi4b to PXE boot from a standard RPi TFTP layout.
           Includes cfgtxt config.txt parser with full VideoCore parity.
          CTRL
          sed -i 's/^          //' $PKG/DEBIAN/control

          dpkg-deb --build $PKG "tmp/debs/qemu-rpi-pxeboot_${FILE_VERSION}_all.deb"

      - name: List all artifacts
        run: ls -lh tmp/debs/

      - uses: actions/upload-artifact@v4
        with:
          name: debs-trixie-amd64
          path: tmp/debs/*.deb
          if-no-files-found: error

  publish-apt-repo:
    # Index, sign and deploy through the shared workflow: one flat repository
    # per suite (<site>/trixie/), key rpi-qemu.gpg, Origin rpi-qemu -- the
    # convention every apt repository follows (docs/conventions.md in
    # mithro/apt-repo-action). It refuses to publish unsigned.
    name: Publish APT repository
    needs: stage-apt
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: mithro/apt-repo-action/.github/workflows/publish-apt.yml@main
    with:
      suites: "trixie"
      architectures: "amd64 all"
      description: "QEMU with Raspberry Pi 4B GENET Ethernet support"
      # Transitional: the previous unsigned dists/trixie archive, frozen, for
      # clients still using [trusted=yes]. Drop once they have moved.
      legacy-paths: "dists/trixie"
    secrets:
      gpg-private-key: ${{ secrets.APT_GPG_PRIVATE_KEY }}

  create-release:
    name: Create GitHub Release
    needs: [build-debs, build-static, build-pxeboot]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          version=$(python3 ci/gen-changelog.py --version-only)
          tag_version=$(python3 ci/gen-changelog.py --tag-version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v${tag_version}" >> "$GITHUB_OUTPUT"
          echo "Release version: $version (tag: v${tag_version})"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "QEMU RPi ${{ steps.version.outputs.version }}"
          body: |
            QEMU with Raspberry Pi 4B GENET Ethernet support.

            Based on QEMU v11.1.0 + 23 patches (Kambalin v6 GENET port).
            PXE boot firmware with cfgtxt config.txt parser (full VideoCore parity).

            **Install via APT** (Debian trixie, amd64; setup on https://fpgas.online/rpi-qemu/):
            ```
            sudo install -d -m0755 /etc/apt/keyrings
            curl -fsSL https://fpgas.online/rpi-qemu/rpi-qemu.gpg | sudo tee /etc/apt/keyrings/rpi-qemu.gpg > /dev/null
            echo "deb [signed-by=/etc/apt/keyrings/rpi-qemu.gpg] https://fpgas.online/rpi-qemu/trixie/ ./" \
              | sudo tee /etc/apt/sources.list.d/rpi-qemu.list
            sudo apt-get update && sudo apt-get install qemu-rpi-system-arm qemu-rpi-pxeboot
            ```

            **Or download the static binary** (no dependencies needed).
          files: |
            artifacts/qemu-rpi-debs/*.deb
            artifacts/qemu-rpi-static/*.tar.gz
          draft: false
          prerelease: false
          make_latest: true
