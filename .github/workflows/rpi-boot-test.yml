name: RPi QEMU Boot Test

on:
  # Called by build-qemu-packages.yml with qemu-source: artifact to boot-test
  # the packages that run just built -- on pull requests as well as main --
  # before anything is published.
  workflow_call:
    inputs:
      qemu-source:
        description: "'artifact' = this run's qemu-rpi-debs; 'apt' = published APT repo"
        type: string
        default: artifact
  # Smoke test of the published APT package after a main build has
  # published it (the build itself has already boot-tested its artifacts).
  workflow_run:
    workflows: ["Build QEMU RPi Packages"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  boot-test:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 45
    # Called runs only exist once the build jobs they need have succeeded;
    # workflow_run fires on any build conclusion, so check it succeeded.
    if: >-
      inputs.qemu-source == 'artifact' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    env:
      QEMU_SOURCE: ${{ inputs.qemu-source || 'apt' }}

    steps:
      - name: Install base tools
        run: |
          apt-get update
          apt-get install -y git ca-certificates curl

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download QEMU packages built by this run
        if: env.QEMU_SOURCE == 'artifact'
        uses: actions/download-artifact@v4
        with:
          name: qemu-rpi-debs
          # Outside tmp/, which is uploaded wholesale on failure.
          path: ci-debs/

      - name: Install QEMU from this run's packages
        if: env.QEMU_SOURCE == 'artifact'
        run: |
          ls -lh ci-debs/
          apt-get install -y \
            ./ci-debs/qemu-rpi-system-arm_*_amd64.deb \
            ./ci-debs/qemu-rpi-system-data_*_all.deb

          echo "=== Installed ==="
          dpkg-query -W qemu-rpi-system-arm qemu-rpi-system-data
          which qemu-rpi-system-aarch64
          qemu-rpi-system-aarch64 --version

      - name: Install QEMU from APT repo
        if: env.QEMU_SOURCE == 'apt'
        run: |
          echo "=== Adding QEMU RPi APT repository ==="
          install -d -m0755 /etc/apt/keyrings
          curl -fsSL https://fpgas.online/rpi-qemu/rpi-qemu.gpg > /etc/apt/keyrings/rpi-qemu.gpg
          echo "deb [signed-by=/etc/apt/keyrings/rpi-qemu.gpg] https://fpgas.online/rpi-qemu/trixie/ ./" \
            > /etc/apt/sources.list.d/rpi-qemu.list
          apt-get update

          echo "=== Installing qemu-rpi-system-arm ==="
          apt-get install -y qemu-rpi-system-arm

          echo "=== Installed ==="
          which qemu-rpi-system-aarch64
          qemu-rpi-system-aarch64 --version

      - name: Install remaining dependencies
        run: |
          apt-get install -y --no-install-recommends \
            build-essential gcc-aarch64-linux-gnu \
            make bc bison flex libssl-dev \
            cpio wget python3

      - name: Cache U-Boot build
        id: cache-uboot
        uses: actions/cache@v4
        with:
          path: test-images/u-boot
          key: uboot-47e064f1-qemu-${{ hashFiles('ci/rpi_4_qemu_defconfig') }}

      - name: Build U-Boot
        if: steps.cache-uboot.outputs.cache-hit != 'true'
        run: |
          mkdir -p test-images
          git clone --depth=100 https://github.com/u-boot/u-boot.git test-images/u-boot
          cd test-images/u-boot
          git checkout 47e064f13171f15817aa1b22b04e309964b15c2c
          cp ../../ci/rpi_4_qemu_defconfig configs/rpi_4_qemu_defconfig
          make rpi_4_qemu_defconfig
          make -j$(nproc) CROSS_COMPILE=aarch64-linux-gnu-

      - name: Ensure U-Boot defconfig is current
        if: steps.cache-uboot.outputs.cache-hit == 'true'
        run: |
          cp ci/rpi_4_qemu_defconfig test-images/u-boot/configs/rpi_4_qemu_defconfig
          cd test-images/u-boot
          make rpi_4_qemu_defconfig
          make -j$(nproc) CROSS_COMPILE=aarch64-linux-gnu-

      - name: Cache RPi kernel
        id: cache-kernel
        uses: actions/cache@v4
        with:
          path: |
            test-images/kernel8.img
            test-images/bcm2711-rpi-4-b.dtb
            test-images/tftpboot/Image
            test-images/tftpboot/bcm2711-rpi-4-b.dtb
          key: rpi-kernel-v1

      - name: Download RPi kernel and DTB
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        run: |
          mkdir -p test-images/tftpboot
          FW_BASE="https://raw.githubusercontent.com/raspberrypi/firmware/master/boot"
          wget -q -O test-images/kernel8.img "$FW_BASE/kernel8.img"
          wget -q -O test-images/bcm2711-rpi-4-b.dtb "$FW_BASE/bcm2711-rpi-4-b.dtb"
          cp test-images/bcm2711-rpi-4-b.dtb test-images/tftpboot/
          # kernel8.img is gzip-compressed; decompress with zcat to get raw Image
          zcat test-images/kernel8.img > test-images/tftpboot/Image

      - name: Download Alpine and build initramfs
        run: |
          mkdir -p test-images
          wget -q -O test-images/alpine-minirootfs.tar.gz \
            "https://dl-cdn.alpinelinux.org/alpine/v3.21/releases/aarch64/alpine-minirootfs-3.21.3-aarch64.tar.gz"
          python3 build-initramfs.py
          mkdir -p test-images/tftpboot
          cp test-images/test-initramfs.cpio.gz test-images/tftpboot/initrd.gz

      - name: Run RPi boot test
        run: |
          echo "=== Running single-instance boot test ==="
          QEMU_OVERRIDE=$(which qemu-rpi-system-aarch64) python3 run-rpi-boot-test.py

      - name: Run socket boot test (no peer)
        run: |
          echo "=== Running socket networking boot test (no peer) ==="
          QEMU_OVERRIDE=$(which qemu-rpi-system-aarch64) python3 run-rpi-socket-boot-test.py

      - name: Run socket network test (with DHCP/TFTP peer)
        run: |
          echo "=== Running socket networking test with peer ==="
          QEMU_OVERRIDE=$(which qemu-rpi-system-aarch64) python3 run-rpi-socket-network-test.py

      - name: Download PXE boot firmware (this run)
        if: env.QEMU_SOURCE == 'artifact'
        uses: actions/download-artifact@v4
        with:
          name: qemu-rpi-pxeboot
          path: tmp/pxeboot-firmware/

      - name: Download PXE boot firmware (triggering build)
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: qemu-rpi-pxeboot
          path: tmp/pxeboot-firmware/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run PXE boot test (cfgtxt + gzip decompression)
        if: env.QEMU_SOURCE == 'artifact' || github.event_name == 'workflow_run'
        run: |
          echo "=== Running PXE boot test (VideoCore emulation) ==="
          ls -lh tmp/pxeboot-firmware/
          QEMU_OVERRIDE=$(which qemu-rpi-system-aarch64) \
          PXEBOOT_OVERRIDE=tmp/pxeboot-firmware/rpi4b-pxeboot.bin \
            python3 run-rpi-pxeboot-test.py

      - name: Run PXE boot test from a flat TFTP root (prefix fallback)
        if: env.QEMU_SOURCE == 'artifact' || github.event_name == 'workflow_run'
        run: |
          QEMU_OVERRIDE=$(which qemu-rpi-system-aarch64) \
          PXEBOOT_OVERRIDE=tmp/pxeboot-firmware/rpi4b-pxeboot.bin \
          PXE_FLAT=1 python3 run-rpi-pxeboot-test.py

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-log-${{ env.QEMU_SOURCE }}
          path: tmp/
          retention-days: 7
